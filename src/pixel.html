<script>

  function lead(u, b){
    var s = String(u || '');
    if (b && typeof b.get === 'function' && b.get('ev') === 'Lead') return true;
    if (typeof b === 'string' || b instanceof URLSearchParams) {
      var t = String(b);
      if (/"event_name"\s*:\s*"Lead"/.test(t)) return true;
      s += '&' + t;
    }
    return /facebook\.com\/tr/.test(s) && /[?&]ev=Lead(&|$)/.test(s);
  }
  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (d && d.set) Object.defineProperty(HTMLImageElement.prototype, 'src', {
    configurable: true, get: d.get,
    set: function(v){ if (!lead(v)) d.set.call(this, v); }
  });
  if (navigator.sendBeacon) { var sb = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function(u, b){ return lead(u, b) ? true : sb(u, b); }; }
  if (window.fetch) { var f = window.fetch;
    window.fetch = function(u, o){ return lead(u && u.url || u, o && o.body) ? Promise.resolve(new Response('{}')) : f.apply(this, arguments); }; }
  var xo = XMLHttpRequest.prototype.open, xs = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(m, u){ this._u = u; return xo.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function(b){ if (lead(this._u, b)) return; return xs.apply(this, arguments); };
})();
</script>
